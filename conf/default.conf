# Демо-конфиг webserv. Пути относительные: запускать из корня проекта.
#   ./webserv                     (без аргумента берётся этот файл)
#   ./webserv conf/default.conf
#
# Три сервера в одном процессе, один poll():
#   :8080            - основной сайт, все возможности
#   :8081            - второй сайт, свой root и маленький лимит тела (413)
#   127.0.0.1:8082   - только локальный интерфейс

server {
	listen 8080;
	root ./www;
	client_max_body_size 1048576;          # 1 MiB

	error_page 404 ./www/errors/404.html;
	error_page 403 405 ./www/errors/4xx.html;
	error_page 413 ./www/errors/413.html;
	error_page 500 502 504 ./www/errors/5xx.html;

	# Статика: GET, index-файл в каталоге
	location / {
		allowed_methods GET;
		index index.html;
	}

	# Листинг каталога (autoindex) и удаление файлов
	# subject: location работает как alias - префикс заменяется на root:
	#   /files/a.txt -> ./www/files/a.txt
	location /files {
		root ./www/files;
		allowed_methods GET DELETE;
		autoindex on;
	}

	# Загрузка: POST /uploads/<имя> сохраняет тело в ./www/uploads/<имя>
	location /uploads {
		root ./www/uploads;
		allowed_methods GET POST DELETE;
		autoindex on;
		upload_enabled on;
		upload_dir ./www/uploads;
	}

	# Каталог без index и без autoindex -> 403
	location /empty {
		root ./www/empty;
		allowed_methods GET;
		autoindex off;
	}

	# HTTP-редирект
	location /old {
		allowed_methods GET;
		return 301 /about/;
	}

	# CGI по расширению: .py -> python3
	location /cgi-bin {
		root ./www/cgi-bin;
		allowed_methods GET POST;
		cgi .py /usr/bin/python3;
	}

	# Второй интерпретатор: .sh -> bash
	location /cgi-sh {
		root ./www/cgi-sh;
		allowed_methods GET;
		cgi .sh /bin/bash;
	}
}

server {
	listen 8081;
	root ./www/site2;
	client_max_body_size 100;               # 100 байт: легко показать 413

	error_page 404 ./www/errors/404.html;
	error_page 413 ./www/errors/413.html;

	location / {
		allowed_methods GET POST;
		index index.html;
		upload_enabled on;
		upload_dir ./www/uploads;
	}
}

server {
	listen 127.0.0.1:8082;
	root ./www/site2;

	location / {
		allowed_methods GET;
		index index.html;
	}
}
